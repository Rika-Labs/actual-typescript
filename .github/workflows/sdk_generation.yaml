name: Generate SDK

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force generation even when no change is detected
        type: boolean
        default: false
      set_version:
        description: Optional exact SDK version
        type: string
  schedule:
    - cron: "0 1 * * *"
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@68f3bfefb79354d39358bf4699863dabd2cea0f6
    with:
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      mode: pr
      set_version: ${{ github.event_name == 'workflow_dispatch' && inputs.set_version || '' }}
      target: actual-typescript
      environment: |
        ACTUAL_OPENAPI_LOCATION=https://docs.askactual.com/openapi/actual-v1.openapi.json
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
